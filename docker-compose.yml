version: "3.8"

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_blog_production
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    # Исправление: принудительное удаление PID перед стартом
    command: >
      bash -c "rm -f tmp/pids/server.pid && 
               bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/app
    ports:
      - "3002:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/app_blog_production
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      # RAILS_MASTER_KEY: ${RAILS_MASTER_KEY} # Раскомментируйте, если используете credentials

volumes:
  db_data: