  portfolio:
    index:
      # FindWay
      main_slogan: "My Projects"
      title_1: "Asynchronous search and data platform. Built with Ruby on Rails, PostgreSQL, and Bootstrap."
      read_1: "Read more…"
      text_1: |
        FindWay is a globally oriented, asynchronous search and data platform designed to collect, index, and surface time-critical 
        user-generated cases involving missing persons, animals, and stolen property across borders. The system operates as a unified 
        data engine with multilingual, region-agnostic data models and cross-border case handling. Built from scratch with Ruby on Rails, 
        scalable media storage using AWS S3, and an architecture optimized for high-volume writes and real-time discovery. The platform is designed 
        to integrate AI-assisted moderation microservices for text and media filtering, operating as independent, scalable components within the system. 
        FindWay is engineered for reliability, data integrity, and operational resilience in high-stress, real-world scenarios, including crisis and wartime conditions.
      #Shiny Dashboard
      title_2: "An interactive Shiny dashboard analyzing the Ukrainian automotive market (2017–2023)."
      title_2_1: | 
                Master's Thesis "UkrCar Analytics"
      read_2: "Read more…"
      text_2: |
             A master's thesis project: a fully interactive R/Shiny dashboard tracking vehicle registrations in Ukraine (2017–2023). 
               Features include dynamic plots, time series forecasting, linear regression, model-(ARIMA), and advanced ETL workflows. 
               Designed for policymakers, economists, and automotive analysts.
      #Social Network
      title_3: "A social platform for sharing and discussing articles, built with Ruby on Rails and PostgreSQL."
      read_3: "Read more…"
      text_3: |
        The system supports user-generated posts, with full commenting functionality at multiple levels, including comments on posts and 
        discussions within thematic threads. Content is structured around topics, allowing users to create, discuss, and moderate themes as 
        independent discussion units, resulting in complex polymorphic relationships between users, content types, and interactions.
        The platform includes, multilingual interface support.
      #FindWay Landing Page
      title_4: "A multilingual landing page for the FindWay project, built with <b>Sinatra</b> and featuring seamless i18n integration and smooth animations."
      read_4: "Read more…"
      text_4: |
        This is a live presentation site and gateway for the FindWay search platform.
        • Internationalization: Supports English, Ukrainian, and Polish via flexible YAML-based i18n.
        • Modern design: Adaptive, clean Bootstrap 5 UI with animated elements.
        • Production-ready: Dockerized, reverse-proxied with Nginx, and secured with HTTPS via Let's Encrypt.
        • Role: Full cycle — from idea and design to infrastructure and deployment.
      #AI Moderation Engine
      title_5: "Modular AI Content Moderation System for FindWay."
      read_5: "Technical stack and architecture..."
      text_5: |
        Architecture with 8 models:
        The system is organized into four independent language contours (CIS, Europe, Baltics, West). Each contour uses two separate ML models: a semantic classifier and a specialized model for detecting slang, text distortions, and obfuscation.

        Hybrid filtering:
        The final decision is produced by a policy layer based on neural network scoring and deterministic rules. This approach ensures strict classification of content into Approved, Pending Review, and Blocked, without direct reliance on a single model.

        Dynamic thresholds:
        Sensitivity thresholds are configured independently for each language contour and can change at runtime depending on textual patterns, special characters, and the degree of input text distortion.
      title_6: "Computer Vision CNN Module for FindWay."
      read_6: "Technical stack and architecture..." 
      text_6: |
        Module (EfficientNet-B0, ArcFace, Content Moderation)
        The module is based on the EfficientNet-B0 architecture—an efficient convolutional neural network for image analysis. It is used for automatic analysis of visual content and filtering of inappropriate materials.

        The computer vision system performs:

        • detection and filtering of inappropriate visual content (violence, prohibited, or explicit materials);
        • image classification for moderation purposes;
        • data preparation for further analysis.

        ArcFace models based on embeddings (vector representations of images) are used for facial recognition tasks. This enables high-accuracy face matching, accounting for differences in camera angles, lighting, and image quality.

        The module is integrated into the moderation system and search infrastructure, ensuring content safety and supporting intelligent image analysis.