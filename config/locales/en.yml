        I write code to <span style="color:#21ba45;font-weight:600;">make the world better</span>: I build search engines, create social platforms, visualize data in <span style="font-family: Orbitron, sans-serif;">Shiny</span>, and develop projects with <span style="color:#bb2200">Ruby on Rails</span> and <span style="color:#306998">R</span>.<br><br>
        My toolkit includes: <strong>cloud (AWS)</strong>, <span style="font-style:italic;">analytics</span>, <strong>algorithms</strong>, <span style="text-decoration: underline;">automation</span>, and an enormous <span style="color:#ff6600">hunger for change</span>.<br>
        My goal is not just to work, but to <span style="color:#21ba45;font-weight:600;">create tools that genuinely benefit people</span>.<br>
