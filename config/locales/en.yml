  home:
    index:
       title: Welcome!
       text: Обо мне Привет! 
             Меня зовут Максим Ненашев, я разработчик и энтузиаст в области технологий, который превращает идеи в работающие проекты. Уже более 10 лет я живу в Польше и работаю над 
             собственными веб-приложениями — от социальных сетей до полезных сервисов для поиска 
             пропавших людей и вещей. 
       
             Мои основные инструменты — Ruby on Rails, R, Shiny, Python, а также облачные технологии AWS и 
             современные методы обработки данных. Я верю, что технологии должны быть не только 
             красивыми, но и полезными.

             На этом сайте вы найдёте ссылки на мои проекты;

                     социальная сеть,

                     международный поисковый сервис,

                     аналитические панели и дашборды,
                     и другие работы, созданные с душой и вниманием к деталям.

             Если вы хотите предложить сотрудничество, оставить отзыв или просто пообщаться — буду 
             рад связи.
  
