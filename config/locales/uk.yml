  portfolio:
    index:
      # FindWay
      main_slogan: "Мої проєкти"
      title_1: "Асинхронна пошукова та дата-платформа. Створено на Ruby on Rails, PostgreSQL і Bootstrap."
      read_1: "Детальніше…"
      text_1: |
        FindWay — це глобально орієнтована, асинхронна пошукова та дата-платформа, розроблена для збору, індексації та висвітлення 
        критичних за часом випадків, створених користувачами, що стосуються зниклих людей, тварин і вкраденого майна через кордони. 
        Система функціонує як єдиний дата-двигун з багатомовними, незалежними від регіону моделями даних і обробкою транскордонних справ. 
        Побудована з нуля на Ruby on Rails, масштабованому сховищі медіафайлів за допомогою AWS S3 та архітектурі, оптимізованій для 
        високого обсягу записів і відкриття в реальному часі. Платформа розроблена для інтеграції мікросервісів модерації з підтримкою ШІ 
        для фільтрації тексту та медіа, які працюють як незалежні, масштабовані компоненти в межах системи. FindWay спроектована для 
        надійності, цілісності даних і операційної стійкості в стресових, реальних сценаріях, включаючи кризові та воєнні умови.
      # Shiny Dashboard
      title_2: "Інтерактивний дашборд Shiny для аналізу автомобільного ринку України (2017–2023)."
      title_2_1: |
        Магістерська робота «UkrCar Analytics»
      read_2: "Детальніше…"
      text_2: |
        Магістерський проєкт: повністю інтерактивний дашборд R/Shiny для відстеження реєстрацій автомобілів в Україні (2017–2023).
        Функції: динамічні графіки, прогнозування часових рядів, лінійна регресія, модель ARIMA та розвинений ETL-процес.
        Створено для потреб управлінців, економістів та аналітиків автомобільного ринку.
      # Social Network
      title_3: "Соціальна платформа для обміну статтями й обговорень, створена на Ruby on Rails і PostgreSQL."
      read_3: "Детальніше…"
      text_3: |
        Система підтримує публікації, створені користувачами, з повною функціональністю коментування на кількох рівнях, 
        включаючи коментарі до публікацій і обговорення в тематичних гілках. Вміст структурований навколо тем, 
        що дозволяє користувачам створювати, обговорювати та модерувати теми як незалежні одиниці обговорення, 
        що призводить до складних поліморфних відносин між користувачами, типами вмісту та взаємодіями.
        Платформа включає підтримку багатомовного інтерфейсу.
      # FindWay Landing Page
      title_4: "Багатомовний лендинг для проєкту FindWay, створений на <b>Sinatra</b> із підтримкою i18n та плавними анімаціями."
      read_4: "Детальніше…"
      text_4: |
        Це сайт-презентація та шлюз для пошукової платформи FindWay.
        • Інтернаціоналізація: Підтримує англійську, українську та польську мови через гнучку YAML-локалізацію.
        • Сучасний дизайн: Адаптивний, чистий інтерфейс Bootstrap 5 з анімованими елементами.
        • Продакшн: Docker, реверсивний проксі Nginx, захист HTTPS через Let's Encrypt.
        • Роль: Весь цикл — від ідеї та дизайну до інфраструктури й розгортання.
      # AI Moderation Engine: Architecture Update
      title_5: "Модульна система AI-модерації контенту для FindWay."
      read_5: "Технічний стек та архітектура..."
      text_5: |
        Архітектура з 8 моделей:
        Система організована у чотири незалежні мовні контури (СНД, Європа, Прибалтика, Захід). Кожен контур використовує дві окремі ML-моделі: семантичний класифікатор та спеціалізовану модель для виявлення сленгу, спотворень тексту й обфускації.

        Гібридна фільтрація:
        Фінальне рішення ухвалюється на рівні policy-шару на основі нейромережевих скорів і детермінованих правил. Такий підхід забезпечує чітку класифікацію контенту на Approved, Pending Review та Blocked без прямої залежності від однієї моделі.

        Динамічні пороги:
        Пороги чутливості налаштовуються окремо для кожного мовного контуру та можуть змінюватися в реальному часі залежно від текстових патернів, спеціальних символів і ступеня спотворення вхідного тексту.
      title_6: "Модуль комп’ютерного зору CNN для FindWay."
      read_6: "Технічний стек та архітектура..."
      text_6: |
        Модуль (EfficientNet-B0, ArcFace, модерація контенту)
        Модуль базується на архітектурі EfficientNet-B0 — ефективній згортковій нейронній мережі для аналізу зображень. Він використовується для автоматичного аналізу візуального контенту та фільтрації небажаних матеріалів.

        Система комп’ютерного зору виконує:

        • виявлення та фільтрацію недопустимого візуального контенту (насильство, заборонені або відверті матеріали);
        • класифікацію зображень для цілей модерації;
        • підготовку даних для подальшого аналізу.

        Для розпізнавання облич використовуються моделі ArcFace, засновані на ембеддингах (векторних представленнях зображень). Це забезпечує високу точність зіставлення облич, враховуючи різницю в ракурсах, освітленні та якості знімків.

        Модуль інтегрований у систему модерації та пошукову інфраструктуру, забезпечуючи безпеку контенту та підтримку інтелектуального аналізу зображень.