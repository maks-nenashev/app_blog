  portfolio:
    index:
      # FindWay
      main_slogan: "Мої проєкти"
      title_1: "Пошукова система для зниклих людей та речей. Створено на Ruby on Rails, PostgreSQL і Bootstrap."
      read_1: "Детальніше…"
      text_1: |
        Соціально значуща пошукова система, яка допомагає знаходити зниклих людей, домашніх тварин або викрадені цінності.
        Розроблена з нуля з підтримкою кількох мов, безпечною автентифікацією (Devise, OmniAuth) та зберіганням медіа на AWS S3.
        Створена для того, щоб бути швидкою, інтуїтивною та зручною на мобільних пристроях — з акцентом на реальні потреби під час війни.
      # Shiny Dashboard
      title_2: "Інтерактивний дашборд Shiny для аналізу автомобільного ринку України (2017–2023)."
      title_2_1: |
        Магістерська робота «UkrCar Analytics»
      read_2: "Детальніше…"
      text_2: |
        Магістерський проєкт: повністю інтерактивний дашборд R/Shiny для відстеження реєстрацій автомобілів в Україні (2017–2023).
        Функції: динамічні графіки, прогнозування часових рядів, лінійна регресія, модель ARIMA та розвинений ETL-процес.
        Створено для потреб управлінців, економістів та аналітиків автомобільного ринку.
      # Social Network
      title_3: "Соціальна платформа для обміну статтями й обговорень, створена на Ruby on Rails і PostgreSQL."
      read_3: "Детальніше…"
      text_3: |
        Власна соціальна мережа, яка підтримує твіти, блогові статті, аватари, багатомовний інтерфейс і редагування профілю.
        Включає контроль доступу за ролями, адаптивний інтерфейс, автентифікацію на основі Devise і завантаження зображень через ActiveStorage.
        Створено для вивчення full-stack архітектури Rails та користувацького UX-дизайну.
      # FindWay Landing Page
      title_4: "Багатомовний лендинг для проєкту FindWay, створений на <b>Sinatra</b> із підтримкою i18n та плавними анімаціями."
      read_4: "Детальніше…"
      text_4: |
        Це сайт-презентація та шлюз для пошукової платформи FindWay.
        • Інтернаціоналізація: Підтримує англійську, українську та польську мови через гнучку YAML-локалізацію.
        • Сучасний дизайн: Адаптивний, чистий інтерфейс Bootstrap 5 з анімованими елементами.
        • Продакшн: Docker, реверсивний проксі Nginx, захист HTTPS через Let's Encrypt.
        • Роль: Весь цикл — від ідеї та дизайну до інфраструктури й розгортання.
      # AI Moderation Engine
      title_5: "Просунутий модуль AI-модерації контенту для FindWay, із використанням <b>R</b>, <b>Keras</b> і <b>TensorFlow</b> для етичної та ефективної фільтрації."
      read_5: "Детальніше…"
      text_5: |
        • Мета: Автоматично виявляти та блокувати токсичний, образливий або небажаний контент до публікації.
        • Технологія: Глибинне навчання на багатомовних датасетах, інтеграція безпосередньо у workflow FindWay.
        • Гнучкість: Інференс у реальному часі, налаштовувані політики для різних мов і сценаріїв.
        • Вплив: Зменшує навантаження на модераторів, захищає спільноту та допомагає дотримуватись регуляцій.

    
      