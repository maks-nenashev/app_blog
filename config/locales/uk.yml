    index:
      title: 'Ласкаво просимо!'
      little_about_me: |
       <div style="font-family: Poppins, Arial, sans-serif; font-size: 1.1rem; color: #222;">
       <span style="font-size: 1.5rem; font-weight: bold;">🙋‍♂️ Трішки про мене</span><br>
       <span style="color: #0056b3;"><strong>Привіт! Я — Максим Ненашев.</strong></span> Я не просто <em>розробник</em>, а <span style="font-weight: 600;">людина з місією</span>.<br>
       Пишу код, щоб <span style="color:#21ba45;font-weight:600;">змінювати світ на краще</span>: створюю пошукові системи, будую соціальні платформи, візуалізую дані у <span style="font-family: Orbitron, sans-serif;">Shiny</span> та розвиваю проєкти на <span style="color:#bb2200">Ruby on Rails</span> і <span style="color:#306998">R</span>.<br><br>
       Мій арсенал: <strong>хмара (AWS)</strong>, <span style="font-style:italic;">аналітика</span>, <strong>алгоритми</strong>, <span style="text-decoration: underline;">автоматизація</span> та величезне <span style="color:#ff6600">бажання змін</span>.<br>
       Моя мета — не просто працювати, а <span style="color:#21ba45;font-weight:600;">створювати інструменти, які реально приносять користь людям</span>.<br>
       Вчуся, створюю, рухаюся вперед.<br>
       <span style="font-weight:bold; color:#bb2200;">І так — я тато двох дітей і маю вогонь у серці. 🔥</span>
       </div>

  
