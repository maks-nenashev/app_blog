      main_slogan: "Де ідеї стають реальністю"
      title: 'Ласкаво просимо!'
      little_about_me: |
        <div style="font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
            font-size: 1.05rem;
            color: #1f2937;
            line-height: 1.7;
            max-width: 820px;">

        <h2 style="font-weight: 600; margin-bottom: 0.5rem;">
          Максим Ненашев
        </h2>

        <p style="margin-top: 0; color: #4b5563;">
          Системний інженер · Платформи даних і системи прийняття рішень
        </p>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0;">

        <p>
            Я проєктую та створюю <strong>асинхронні, орієнтовані на дані платформи</strong>
            та <strong>системи прийняття рішень</strong>, у яких дані, алгоритми
            й логіка управління взаємодіють у виробничих середовищах.
        </p>

        <p>
            Моя робота охоплює архітектуру бекенду, API, обробку даних,
            аналітику та компоненти на основі штучного інтелекту.
            Я зосереджуюсь на <strong>поведінці системи</strong>, масштабованості
            та чіткому розділенні між сигналами, рішеннями й виконанням.
        </p>

        <p>
            Основні технології, з якими я працюю:
            <strong>Ruby on Rails</strong>,
            <strong>Python</strong>,
            <strong>R/Shiny</strong>,
            а також компоненти машинного навчання,
            створені з використанням <strong>Scikit-learn, PyTorch, TensorFlow, Keras</strong>.
            Я розглядаю машинне навчання як частину ширшої системи,
            а не як ізольоване рішення.
        </p>

        <p>
            Мене цікавлять складні системи, асинхронна обробка,
            спостережуваність та відповідальне використання
            штучного інтелекту в реальних продуктах.
        </p>

