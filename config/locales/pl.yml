  portfolio:
    index:
      # FindWay
      main_slogan: "Moje Projekty"
      title_1: "Asynchroniczna platforma wyszukiwania i danych. Zbudowana w Ruby on Rails, PostgreSQL i Bootstrap."
      read_1: "Czytaj więcej…"
      text_1: |
        FindWay to globalnie zorientowana, asynchroniczna platforma wyszukiwania i danych zaprojektowana do zbierania, indeksowania i udostępniania 
        pilnych przypadków zgłaszanych przez użytkowników dotyczących zaginionych osób, zwierząt i skradzionego mienia ponad granicami. 
        System działa jako zunifikowany silnik danych z wielojęzycznymi, niezależnymi od regionu modelami danych i obsługą spraw transgranicznych. 
        Zbudowany od podstaw w Ruby on Rails, skalowalnym magazynie mediów przy użyciu AWS S3 oraz architekturze zoptymalizowanej pod kątem 
        dużej liczby zapisów i odkrywania w czasie rzeczywistym. Platforma jest zaprojektowana do integracji mikroserwisów moderacji wspomaganych 
        przez AI do filtrowania tekstu i mediów, działających jako niezależne, skalowalne komponenty w ramach systemu. FindWay jest inżynierią 
        dla niezawodności, integralności danych i odporności operacyjnej w stresujących, rzeczywistych scenariuszach, w tym podczas kryzysów i wojny.
      # Shiny Dashboard
      title_2: "Interaktywny dashboard Shiny analizujący rynek motoryzacyjny Ukrainy (2017–2023)."
      title_2_1: |
        Praca magisterska „UkrCar Analytics”
      read_2: "Czytaj więcej…"
      text_2: |
        Projekt magisterski: w pełni interaktywny dashboard R/Shiny śledzący rejestracje pojazdów na Ukrainie (2017–2023).
        Funkcje: dynamiczne wykresy, prognozowanie szeregów czasowych, regresja liniowa, model ARIMA oraz zaawansowane przetwarzanie ETL.
        Zaprojektowany z myślą o decydentach, ekonomistach i analitykach branży motoryzacyjnej.
      # Social Network
      title_3: "Platforma społecznościowa do dzielenia się artykułami i dyskusji, zbudowana w Ruby on Rails i PostgreSQL."
      read_3: "Czytaj więcej…"
      text_3: |
        System obsługuje treści generowane przez użytkowników, z pełną funkcjonalnością komentowania na wielu poziomach, 
        w tym komentarze do postów i dyskusje w ramach tematycznych wątków. Treści są strukturyzowane wokół tematów, 
        co pozwala użytkownikom tworzyć, omawiać i moderować tematy jako niezależne jednostki dyskusyjne, 
        co skutkuje złożonymi relacjami polimorficznymi między użytkownikami, typami treści i interakcjami.
        Platforma obejmuje obsługę interfejsu wielojęzycznego.
      # FindWay Landing Page
      title_4: "Wielojęzyczny landing page dla projektu FindWay, zbudowany w <b>Sinatra</b> z integracją i18n i płynnymi animacjami."
      read_4: "Czytaj więcej…"
      text_4: |
        To jest strona prezentacyjna i brama do platformy FindWay.
        • Internacjonalizacja: Obsługuje angielski, ukraiński i polski przez elastyczne i18n oparte na YAML.
        • Nowoczesny design: Adaptacyjny, przejrzysty interfejs Bootstrap 5 z animowanymi elementami.
        • Gotowe do produkcji: Docker, reverse proxy Nginx, zabezpieczone HTTPS przez Let's Encrypt.
        • Rola: Pełen cykl — od pomysłu i projektu po infrastrukturę i wdrożenie.
      # AI Moderation Engine
      title_5: "Modułowy system moderacji AI dla FindWay."
      read_5: "Stos technologiczny i architektura..."
      text_5: |
        Architektura z 8 modeli:
        System jest zorganizowany w cztery niezależne kontury językowe (WNP/CIS, Europa, Kraje Bałtyckie, Zachód). Każdy kontur wykorzystuje dwa oddzielne modele ML: klasyfikator semantyczny oraz wyspecjalizowany model do wykrywania slangu, zniekształceń tekstu i obfuskacji.

        Filtrowanie hybrydowe:
        Końcowa decyzja podejmowana jest na poziomie warstwy policy, w oparciu o wyniki modeli neuronowych oraz deterministyczne reguły. Takie podejście zapewnia ścisłą klasyfikację treści na Approved, Pending Review oraz Blocked, bez bezpośredniego uzależnienia od pojedynczego modelu.

        Dynamiczne progi:
        Progi czułości są konfigurowane niezależnie dla każdego konturu językowego i mogą być modyfikowane w czasie rzeczywistym w zależności od wzorców tekstowych, znaków specjalnych oraz stopnia zniekształcenia danych wejściowych.
      title_6: "Moduł Computer Vision CNN dla FindWay."
      read_6: "Technologiczny stos i architektura..."
      text_6: |
        Moduł (EfficientNet-B0, ArcFace, moderacja treści)
        Moduł opiera się na architekturze EfficientNet-B0 — efektywnej sieci neuronowej do analizy obrazów. Służy do automatycznej analizy treści wizualnych i filtrowania niedozwolonych materiałów.

        System computer vision realizuje:

        • wykrywanie i filtrowanie niedozwolonych treści wizualnych (przemoc, materiały zakazane lub o charakterze erotycznym);
        • klasyfikację obrazów na potrzeby moderacji;
        • przygotowanie danych do dalszej analizy.

        Do rozpoznawania twarzy wykorzystywane są modele ArcFace, oparte na embeddingach (wektorowych reprezentacjach obrazów). Pozwala to na wysoką dokładność dopasowania twarzy, uwzględniając różnice w kątach ujęcia, oświetleniu i jakości zdjęć.

        Moduł jest zintegrowany z systemem moderacji i infrastrukturą wyszukiwania, zapewniając bezpieczeństwo treści oraz wsparcie inteligentnej analizy obrazów.