       <h2 style="font-weight: 600; margin-bottom: 0.5rem;">
           Maksym Nenashev
       </h2>

       <p style="margin-top: 0; color: #4b5563;">
          Distributed System Engineer · Platformy danych i systemy decyzyjne
       </p>

       <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0;">

       <p>
          Projektuję i tworzę <strong>asynchroniczne, oparte na danych platformy</strong>
          oraz <strong>systemy podejmowania decyzji</strong>, w których dane,
          algorytmy i logika decyzyjna współdziałają w środowiskach produkcyjnych.
       </p>

       <p>
          Moja praca obejmuje architekturę backendu, API, przetwarzanie danych,
          analitykę oraz komponenty oparte na sztucznej inteligencji.
          Skupiam się na <strong>zachowaniu systemu</strong>, skalowalności
          oraz jasnym rozdziale pomiędzy sygnałami, decyzjami i wykonaniem.
       </p>

       <p>
          Główne technologie, z którymi pracuję, to
          <strong>Ruby on Rails</strong>,
          <strong>Python</strong>,
          <strong>R/Shiny</strong>
          oraz komponenty uczenia maszynowego tworzone z użyciem <strong>Scikit-learn, PyTorch, TensorFlow, Keras</strong>.
          Traktuję uczenie maszynowe jako część szerszego systemu,
          a nie jako odizolowane rozwiązanie.
       </p>

       <p>
          Interesują mnie złożone systemy, przetwarzanie asynchroniczne,
          obserwowalność oraz odpowiedzialne wykorzystanie AI
          w rzeczywistych produktach.
       </p>

