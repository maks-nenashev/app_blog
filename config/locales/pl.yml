      title: 'Witamy!'
      little_about_me: |
       <div style="font-family: Poppins, Arial, sans-serif; font-size: 1.1rem; color: #222;">
       <span style="font-size: 1.5rem; font-weight: bold;">🙋‍♂️ Kilka słów o mnie</span><br>
       <span style="color: #0056b3;"><strong>Cześć! Jestem Maksym Nenashev.</strong></span> Nie jestem tylko <em>programistą</em>, ale <span style="font-weight: 600;">człowiekiem z misją</span>.<br>
       Piszę kod, aby <span style="color:#21ba45;font-weight:600;">zmieniać świat na lepsze</span>: tworzę wyszukiwarki, buduję platformy społecznościowe, wizualizuję dane w <span style="font-family: Orbitron, sans-serif;">Shiny</span>, rozwijam projekty w <span style="color:#bb2200">Ruby on Rails</span> oraz <span style="color:#306998">R</span>.<br><br>
       W moim arsenale znajdziesz: <strong>chmurę (AWS)</strong>, <span style="font-style:italic;">analitykę</span>, <strong>algorytmy</strong>, <span style="text-decoration: underline;">automatyzację</span> oraz ogromną <span style="color:#ff6600">potrzebę zmian</span>.<br>
       Moim celem nie jest tylko praca, ale <span style="color:#21ba45;font-weight:600;">tworzenie narzędzi naprawdę pożytecznych dla ludzi</span>.<br>
       Uczę się, tworzę, idę do przodu.<br>
       <span style="font-weight:bold; color:#bb2200;">I tak — jestem ojcem dwójki dzieci i mam ogień w sercu. 🔥</span>
       </div>

  
