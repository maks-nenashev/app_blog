  portfolio:
    index:
      # FindWay
      main_slogan: "Мои проекты"
      title_1: "Поисковая система для пропавших людей и вещей. Реализовано на Ruby on Rails, PostgreSQL и Bootstrap."
      read_1: "Подробнее…"
      text_1: |
        Социально значимая поисковая система, которая помогает находить пропавших людей, домашних животных или украденные ценности.
        Разработано с нуля с поддержкой мультиязычности, безопасной аутентификацией (Devise, OmniAuth) и хранением медиа на AWS S3.
        Система быстрая, интуитивная и мобильная — акцент на реальные потребности во времена войны.
      # Shiny Dashboard
      title_2: "Интерактивный дашборд Shiny для анализа автомобильного рынка Украины (2017–2023)."
      title_2_1: |
        Магистерская работа «UkrCar Analytics»
      read_2: "Подробнее…"
      text_2: |
        Проект магистерской работы: полностью интерактивный дашборд на R/Shiny для анализа регистраций автомобилей в Украине (2017–2023).
        Возможности: динамические графики, прогнозирование временных рядов, линейная регрессия, модель ARIMA и продвинутый ETL.
        Разработано для аналитиков, экономистов и специалистов по транспорту.
      # Social Network
      title_3: "Социальная платформа для обмена и обсуждения статей, реализованная на Ruby on Rails и PostgreSQL."
      read_3: "Подробнее…"
      text_3: |
        Индивидуально разработанная социальная сеть с поддержкой твитов, блогов, аватаров, мультиязычного интерфейса и редактирования профилей.
        Включает контроль доступа по ролям, адаптивный интерфейс, аутентификацию через Devise и загрузку изображений через ActiveStorage.
        Создано для отработки full-stack архитектуры Rails и ориентированного на пользователя UX-дизайна.
      # FindWay Landing Page
      title_4: "Многоязычный лендинг для FindWay, реализованный на <b>Sinatra</b> с поддержкой i18n и анимациями."
      read_4: "Подробнее…"
      text_4: |
        Это презентационный сайт и портал для платформы FindWay.
        • Интернационализация: поддержка английского, украинского и польского языков с помощью YAML i18n.
        • Современный дизайн: адаптивный, чистый Bootstrap 5 UI с анимациями.
        • Продакшн: Docker, обратный прокси через Nginx, HTTPS с Let's Encrypt.
        • Роль: Полный цикл — от идеи и дизайна до инфраструктуры и деплоя.
      # AI Moderation Engine
      title_5: "Современный AI-модуль модерации контента для FindWay на базе <b>R</b>, <b>Keras</b> и <b>TensorFlow</b> для эффективной и этичной фильтрации."
      read_5: "Подробнее…"
      text_5: |
        • Цель: Автоматически обнаруживать и блокировать токсичный, оскорбительный или нежелательный контент до публикации.
        • Технологии: Глубокое обучение на мультиязычных датасетах, интеграция прямо в workflow FindWay.
        • Гибкость: Мгновенный inference, настраиваемые правила для разных языков и сценариев.
        • Эффект: Снижает нагрузку на модераторов, защищает сообщество и помогает соблюдать законодательство.


