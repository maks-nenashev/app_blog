      title: "<span style='font-family:Poppins,Arial,sans-serif; font-size:2rem; font-weight:700;'>Добро пожаловать!</span>"
      little_about_me: | 
        <div style="font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
            font-size: 1.05rem;
            color: #1f2937;
            line-height: 1.7;
            max-width: 820px;">

        <h2 style="font-weight: 600; margin-bottom: 0.5rem;">
           Максим Ненашев
        </h2>

        <p style="margin-top: 0; color: #4b5563;">
           Инженер распределенных систем · Платформы данных и принятия решений
        </p>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0;">

        <p>
           Я проектирую и создаю <strong>асинхронные платформы управления данными</strong>
           и <strong>системы принятия решений</strong>, где данные, алгоритмы и логика политик (policy logic)
           эффективно работают вместе в продакшен-среде.
        </p>

        <p>
           Моя работа охватывает архитектуру бэкенда, API, обработку данных, аналитику
           и компоненты на базе искусственного интеллекта. Я фокусируюсь на <strong>поведении систем</strong>,
           масштабируемости и четком разделении между сигналами, решениями и исполнением.
        </p>

        <p>
           Основной технологический стек включает в себя
           <strong>Ruby on Rails</strong>,
           <strong>Python</strong>,
           <strong>R/Shiny</strong>
           и ML-компоненты, построенные с использованием <strong>Scikit-learn, PyTorch, TensorFlow, Keras</strong>.
           Я рассматриваю машинное обучение как часть более широкой системы, а не как изолированное решение.
        </p>

        <p>
           Меня интересуют сложные системы, асинхронная обработка данных,
           наблюдаемость (observability) и ответственное использование ИИ в реальных продуктах.
        </p>

