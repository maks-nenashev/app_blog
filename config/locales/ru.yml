  portfolio:
    index:
      main_slogan: "Мои Проекты"
      title_1: "Асинхронная поисковая платформа данных. Построена на Ruby on Rails, PostgreSQL и Bootstrap."
      read_1: "Подробнее…"
      text_1: |
        FindWay — это глобально ориентированная асинхронная поисковая платформа данных, предназначенная для сбора, индексации и оперативного вывода критичных ко времени пользовательских кейсов, связанных с поиском пропавших людей, животных и похищенного имущества за рубежом. Система функционирует как единый движок данных с мультиязычными, региононезависимыми моделями данных и возможностью обработки трансграничных инцидентов. Разработана с нуля на Ruby on Rails, использует масштабируемое медиа-хранилище на базе AWS S3 и архитектуру, оптимизированную для высоконагруженной записи и обнаружения данных в реальном времени. Платформа спроектирована для интеграции микросервисов модерации на базе ИИ для фильтрации текста и медиаконтента, функционирующих как независимые, масштабируемые компоненты системы. FindWay разработана с акцентом на надежность, целостность данных и операционную устойчивость в высокострессовых сценариях реального мира, включая кризисные условия и военное положение.
      title_2: "Интерактивный дашборд Shiny для анализа автомобильного рынка Украины (2017–2023)."
      title_2_1: | 
                Магистерская диссертация "UkrCar Analytics"
      read_2: "Подробнее…"
      text_2: |
             Проект магистерской диссертации: полностью интерактивный дашборд на R/Shiny, отслеживающий регистрацию транспортных средств в Украине (2017–2023 гг.). Включает динамические графики, прогнозирование временных рядов, линейную регрессию, моделирование (ARIMA) и продвинутые процессы ETL. Разработан для профильных ведомств, экономистов и автомобильных аналитиков.
      title_3: "Социальная платформа для обмена и обсуждения статей, построенная на Ruby on Rails и PostgreSQL."
      read_3: "Подробнее…"
      text_3: |
        Система поддерживает публикации, создаваемые пользователями, с полноценным функционалом многоуровневого комментирования, включая комментарии к постам и дискуссии внутри тематических веток. Контент структурирован вокруг тем, что позволяет пользователям создавать, обсуждать и модерировать ветки как независимые дискуссионные единицы. Это формирует сложные полиморфные связи между пользователями, типами контента и взаимодействиями. Платформа включает встроенную поддержку мультиязычного интерфейса.
      title_4: "Мультиязычный лендинг для проекта FindWay, созданный на базе <b>Sinatra</b> с бесшовной интеграцией i18n и плавной анимацией."
      read_4: "Подробнее…"
      text_4: |
        Презентационный сайт и точка входа для поисковой платформы FindWay.
        • Интернационализация: Поддержка английского, украинского и польского языков через гибкую систему i18n на базе YAML.
        • Современный дизайн: Адаптивный, чистый интерфейс на Bootstrap 5 с анимированными элементами.
        • Готовность к продакшену: Контейнеризирован с помощью Docker, развернут за реверс-прокси Nginx и защищен HTTPS через Let's Encrypt.
        • Роль: Полный цикл — от идеи и дизайна до инфраструктуры и деплоя.
      title_5: "Модульная система модерации контента на базе ИИ для FindWay."
      read_5: "Технологический стек и архитектура..."
      text_5: |
        Архитектура из 8 моделей:
        Система разделена на четыре независимых языковых контура (СНГ, Европа, Балтия, Запад). Каждый контур задействует две отдельные ML-модели: семантический классификатор и специализированную модель для обнаружения сленга, текстовых искажений и обфускации.

        Гибридная фильтрация:
        Итоговое решение выносится на уровне политик (policy layer) на основе скоринга нейросетей и детерминированных правил. Такой подход гарантирует строгую классификацию контента на «Одобрено», «Ожидает проверки» и «Заблокировано» без прямой зависимости от какой-то одной модели.

        Динамические пороги:
        Пороги чувствительности настраиваются автономно для каждого языкового контура и могут изменяться прямо в рантайме в зависимости от текстовых паттернов, спецсимволов и степени искажения входного текста.
      title_6: "Модуль компьютерного зрения на базе CNN для FindWay."
      read_6: "Технологический стек и архитектура..." 
      text_6: |
        Модуль (EfficientNet-B0, ArcFace, Модерация контента)
        Модуль построен на архитектуре EfficientNet-B0 — эффективной сверточной нейросети для анализа изображений. Применяется для автоматического анализа визуального контента и фильтрации неприемлемых материалов.

        Система компьютерного зрения выполняет:

        • обнаружение и фильтрацию неприемлемого визуального контента (жестокость, запрещенные или откровенные материалы);
        • классификацию изображений для целей модерации;
        • подготовку данных для дальнейшего анализа.

        Для задач распознавания лиц используются модели ArcFace на основе эмбеддингов (векторных представлений изображений). Это обеспечивает высокую точность сопоставления лиц с учетом различий в ракурсах камер, освещении и качестве снимков.

        Модуль интегрирован в общую систему модерации и поисковую инфраструктуру, гарантируя безопасность контента и поддерживая интеллектуальный анализ изображений.