  portfolio:
    index:
      # FindWay
      main_slogan: "Mijn Projecten"
      title_1: "Asynchroon zoek- en dataplatform. Gemaakt met Ruby on Rails, PostgreSQL en Bootstrap."
      read_1: "Lees meer…"
      text_1: |
        FindWay is een wereldwijd georiënteerd, asynchroon zoek- en dataplatform dat is ontworpen om tijdkritische 
        door gebruikers gegenereerde zaken met betrekking tot vermiste personen, dieren en gestolen eigendommen over 
        grenzen heen te verzamelen, te indexeren en naar voren te brengen. Het systeem functioneert als een 
        verenigde data-engine met meertalige, regio-onafhankelijke datamodellen en grensoverschrijdende zaakafhandeling. 
        Vanaf de basis gebouwd met Ruby on Rails, schaalbare mediabestanden met AWS S3, en een architectuur die is 
        geoptimaliseerd voor hoge volumes schrijfbewerkingen en realtime ontdekking. Het platform is ontworpen om AI-ondersteunde 
        moderatieservices voor tekst- en mediafiltering te integreren, die als onafhankelijke, schaalbare componenten binnen het systeem werken. 
        FindWay is ontwikkeld voor betrouwbaarheid, gegevensintegriteit en operationele veerkracht in stressvolle, real-world scenario's, 
        waaronder crisis- en oorlogs situaties.
      # Shiny Dashboard
      title_2: "Een interactieve Shiny-dashboardanalyse van de Oekraïense automarkt (2017–2023)."
      title_2_1: |
        Masterproef "UkrCar Analytics"
      read_2: "Lees meer…"
      text_2: |
        Een masterproject: een volledig interactief R/Shiny-dashboard dat voertuigregistraties in Oekraïne bijhoudt (2017–2023). 
        Functies zijn onder meer dynamische grafieken, tijdreeksvoorspellingen, lineaire regressie, ARIMA-modellen en geavanceerde ETL-workflows.
        Ontworpen voor beleidsmakers, economen en analisten.
      # Social Media Platform
      title_3: "Een sociaal platform voor het delen en bespreken van artikelen, gebouwd met Ruby on Rails en PostgreSQL."
      read_3: "Lees meer…"
      text_3: |
        Het systeem ondersteunt door gebruikers gegenereerde berichten, met volledige commentaarfunctionaliteit op meerdere niveaus, 
        inclusief opmerkingen over berichten en discussies binnen thematische threads. Inhoud is gestructureerd rond onderwerpen, 
        waardoor gebruikers thema's kunnen creëren, bespreken en modereren als onafhankelijke discussie-eenheden, wat resulteert in complexe 
        polymorfe relaties tussen gebruikers, inhoudstypen en interacties.
        Het platform omvat meertalige interface-ondersteuning.
      # FindWay Landing Page
      title_4: "Een meertalige landingspagina voor het FindWay-project, gebouwd met <b>Sinatra</b>, voorzien van naadloze i18n-integratie en vloeiende animaties."
      read_4: "Lees meer…"
      text_4: |
        Dit is een live presentatiesite en toegangspoort tot het FindWay-platform.
        • Internationalisatie: Ondersteunt Engels, Oekraïens en Pools via flexibele YAML-gebaseerde i18n.
        • Modern ontwerp: Adaptieve, schone Bootstrap 5 UI met animaties.
        • Productieklaar: Gedockeriseerd, reverse-proxied met Nginx, beveiligd met HTTPS via Let's Encrypt.
        • Rol: Volledige cyclus — van idee en ontwerp tot infrastructuur en implementatie.
      # AI Moderation Engine
      title_5: "Modulair AI-moderatiesysteem voor FindWay."
      read_5: "Technische stack en architectuur..."
      text_5: |
        Architectuur met 8 modellen:
        Het systeem is georganiseerd in vier onafhankelijke taalkundige contouren (GOS/CIS, Europa, Baltische staten, Westen). Elke contour maakt gebruik van twee afzonderlijke ML-modellen: een semantische classifier en een gespecialiseerd model voor het detecteren van slang, tekstvervormingen en obfuscatie.

        Hybride filtering:
        De uiteindelijke beslissing wordt genomen op het niveau van de policy-laag, op basis van neurale netwerkscores en deterministische regels. Deze aanpak zorgt voor een strikte classificatie van content in Approved, Pending Review en Blocked, zonder directe afhankelijkheid van één enkele modeluitkomst.

        Dynamische drempels:
        Gevoeligheidsdrempels worden afzonderlijk geconfigureerd voor elke taalkundige contour en kunnen tijdens runtime worden aangepast op basis van tekstuele patronen, speciale tekens en de mate van vervorming van de invoertekst.
      
      title_6: "Computer Vision CNN Module voor FindWay."
      read_6: "Technical stack and architecture..."
      text_6: |
        Module (EfficientNet-B0, ArcFace, Content Moderation)
        The module is based on the EfficientNet-B0 architecture—an efficient convolutional neural network for image analysis. It is used for automatic analysis of visual content and filtering of inappropriate materials.

        The computer vision system performs:

        • detection and filtering of inappropriate visual content (violence, prohibited, or explicit materials);
        • image classification for moderation purposes;
        • data preparation for further analysis.

        ArcFace models based on embeddings (vector representations of images) are used for facial recognition tasks. This enables high-accuracy face matching, accounting for differences in camera angles, lighting, and image quality.

        The module is integrated into the moderation system and search infrastructure, ensuring content safety and supporting intelligent image analysis.