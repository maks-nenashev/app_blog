      main_slogan: "Waar ideeën tot leven komen"
      title: "<span style='font-family:Poppins,Arial,sans-serif; font-size:2rem; font-weight:700;'>Welkom!</span>"
      little_about_me: |
        <div style="font-family: Poppins, Arial, sans-serif; font-size: 1.1rem; color: #222;">
          <span style="font-size: 1.5rem; font-weight: bold;">🙋‍♂️ Even voorstellen</span><br>
          <span style="color: #0056b3;"><strong>Hallo! Ik ben Maksym Nenashev.</strong></span> Niet zomaar een <em>ontwikkelaar</em>, maar een <span style="font-weight: 600;">persoon met een missie</span>.<br>
          Ik schrijf code om de <span style="color:#21ba45;font-weight:600;">wereld te verbeteren</span>: ik bouw zoekmachines, sociale platforms, visualiseer data in <span style="font-family: Orbitron, sans-serif;">Shiny</span> en ontwikkel projecten met <span style="color:#bb2200">Ruby on Rails</span> en <span style="color:#306998">R</span>.<br><br>
          Mijn toolkit bevat: <strong>cloud (AWS)</strong>, <span style="font-style:italic;">analytics</span>, <strong>algoritmes</strong>, <span style="text-decoration: underline;">automatisering</span> en een enorme <span style="color:#ff6600">honger naar verandering</span>.<br>
          Mijn doel is niet alleen werken, maar <span style="color:#21ba45;font-weight:600;">hulpmiddelen creëren die echt mensen helpen</span>.<br>
          Ik leer, ik bouw, ik ga vooruit.<br>
          <span style="font-weight:bold; color:#bb2200;">En ja — ik ben vader van twee en ik heb vuur in mijn hart. 🔥</span>
