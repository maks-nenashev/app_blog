  portfolio:
    index:
      main_slogan: "Mijn Projecten"
      title_1: "Een zoekmachine voor vermiste personen en voorwerpen. Gemaakt met Ruby on Rails, PostgreSQL en Bootstrap."
      read_1: "Lees meer…"
      text_1: |
        Een sociaal betrokken zoekmachine om mensen te helpen hun geliefden, huisdieren of gestolen bezittingen terug te vinden.
        Vanaf nul gebouwd met meertalige ondersteuning, veilige authenticatie via Devise en OmniAuth, en AWS S3 voor mediaopslag.
        Ontworpen om snel, intuïtief en mobielvriendelijk te zijn — met een focus op echte behoeften in oorlogstijd.
      title_2: "Een interactieve Shiny-dashboardanalyse van de Oekraïense automarkt (2017–2023)."
      title_2_1: |
        Masterproef "UkrCar Analytics"
      read_2: "Lees meer…"
      text_2: |
        Een masterproject: een volledig interactief R/Shiny-dashboard dat voertuigregistraties in Oekraïne bijhoudt (2017–2023). 
        Functies zijn onder meer dynamische grafieken, tijdreeksvoorspellingen, lineaire regressie, ARIMA-modellen en geavanceerde ETL-workflows.
        Ontworpen voor beleidsmakers, economen en analisten.
      title_3: "Een sociaal platform voor het delen en bespreken van artikelen, gebouwd met Ruby on Rails en PostgreSQL."
      read_3: "Lees meer…"
      text_3: |
        Een zelfgebouwd sociaal netwerk dat tweets, blogartikelen, avatars, meertalige interfaces en profielbewerking ondersteunt.
        Inclusief toegangscontrole op basis van rollen, responsieve UI, Devise-authenticatie en afbeeldingsuploads via ActiveStorage.
        Gemaakt om volledige stack Rails-architectuur en UX-design te verkennen.
      title_4: "Een meertalige landingspagina voor het FindWay-project, gebouwd met <b>Sinatra</b>, voorzien van naadloze i18n-integratie en vloeiende animaties."
      read_4: "Lees meer…"
      text_4: |
        Dit is een live presentatiesite en toegangspoort tot het FindWay-platform.
        • Internationalisatie: Ondersteunt Engels, Oekraïens en Pools via flexibele YAML-gebaseerde i18n.
        • Modern ontwerp: Adaptieve, schone Bootstrap 5 UI met animaties.
        • Productieklaar: Gedockeriseerd, reverse-proxied met Nginx, beveiligd met HTTPS via Let's Encrypt.
        • Rol: Volledige cyclus — van idee en ontwerp tot infrastructuur en implementatie.
      title_5: "Geavanceerde AI-aangedreven moderatiemotor voor FindWay, met <b>R</b>, <b>Keras</b> en <b>TensorFlow</b> voor robuuste en ethische inhoudsfiltering."
      read_5: "Lees meer…"
      text_5: |
        • Doel: Automatisch toxische, aanstootgevende of ongewenste inhoud detecteren en blokkeren vóór publicatie.
        • Technologie: Deep learning modellen getraind op meertalige datasets, direct geïntegreerd in FindWay.
        • Flexibiliteit: Realtime inferentie, aanpasbaar beleid per taal en situatie.
        • Impact: Vermindert handmatige moderatielast, beschermt de gemeenschap en helpt bij naleving van regelgeving.

